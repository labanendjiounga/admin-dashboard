<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container grid">
    
    <div class="sidebar grid">
      
      <div class="top grid">
        <div class="branding grid"><img src="./img/dashboard.svg" alt="Dashboard icon" width="32" height="32"></div>
        <div class="navigation grid">Dashboard</div>
      </div>

      <div class="middle grid">
        <div class="grid">
          <div class="branding grid"><img src="./img/home.svg" alt="Home icon" width="16" height="16"></div>
          <div class="navigation grid">Home</div>
        </div>
        <div class="grid">
          <div class="branding grid"><img src="./img/profile.svg" alt="Profile icon" width="16" height="16"></div>
          <div class="navigation grid">Profile</div>
        </div>
        <div class="grid">
          <div class="branding grid"><img src="./img/messages.svg" alt="Messages icon" width="16" height="16"></div>
          <div class="navigation grid">Messages</div>
        </div>
        <div class="grid">
          <div class="branding grid"><img src="./img/history.svg" alt="History icon" width="16" height="16"></div>
          <div class="navigation grid">History</div>
        </div>
        <div class="grid">
          <div class="branding grid"><img src="./img/tasks.svg" alt="Tasks icon" width="16" height="16"></div>
          <div class="navigation grid">Tasks</div>
        </div>
        <div class="grid">
          <div class="branding grid"><img src="./img/communities.svg" alt="Communities icon" width="16" height="16"></div>
          <div class="navigation grid">Communities</div>
        </div>
      </div>

      <div class="bottom grid">
        <div class="grid">
          <div class="branding grid"><img src="./img/settings.svg" alt="Settings icon" width="16" height="16"></div>
          <div class="navigation grid">Settings</div>
        </div>
        <div class="grid">
          <div class="branding grid"><img src="./img/support.svg" alt="Support icon" width="16" height="16"></div>
          <div class="navigation grid">Support</div>
        </div>
        <div class="grid">
          <div class="branding grid"><img src="./img/privacy.svg" alt="Privacy icon" width="16" height="16"></div>
          <div class="navigation grid">Privacy</div>
        </div>
      </div>
    
    </div>

    <div class="header"></div>

    <div class="main"></div>
  
  </div>
</body>
</html>
